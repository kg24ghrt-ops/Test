name: Remote Run Java
on:
  push:
    branches:
      - 'runs/**'

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Execute Java Program
        run: |
          mkdir -p logs
          # Extract Run ID from the JSON file pushed by the extension
          RUN_ID=$(grep -oP '(?<="runId":")[^"]*' input/run.json)
          
          echo "Starting Java Compilation..."
          javac src/Main.java
          
          echo "Running Program..."
          # Redirect output to the specific run log
          java -cp src Main > logs/output_${RUN_ID}.txt 2>&1 || echo '--- EXECUTION FAILED ---' >> logs/output_${RUN_ID}.txt
          
          echo '--- FINISHED ---' >> logs/output_${RUN_ID}.txt

      - name: Force Sync Logs to Branch
        run: |
          git config user.name "Remote-Runner-Bot"
          git config user.email "runner@internal"
          git add logs/
          git commit -m "Results for Run"
          # Force push ensures the extension sees the logs immediately
          git push origin HEAD:${{ github.ref_name }} --force